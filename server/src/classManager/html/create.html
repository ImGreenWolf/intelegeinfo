<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creaza Clasa</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Playwrite+DK+Loopet:wght@100..400&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <style>
        form {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            gap: 2em;
            width: 300px;
            font-family: Poppins;
            
            input {
                padding: 1em 2em;
                border-radius: 1em;
                outline: none;
                border: none;
            }
            textarea {
                padding: 1em;
                border-radius: 1em;
                font-family: inherit;
            }
            button {
                width: 50%;
                padding: 1em 0;
                margin: auto;
                border-radius: 1em;
                border: none;
                font-family: inherit;
                font-weight: 600;
                color: white;
                background-color: rgb(1, 110, 173);
            }
            a {
                color: inherit;
                font-family: inherit;
                text-decoration: none;
                opacity: 0.75;
            }
            label {
                display: flex;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    ^{&file:_header.html}

    <form action="" method="post">
        <h2 style="text-align: center;">Creaza o Clasa Noua</h2>
        <input type="text" name="name" id="name" placeholder="Numele Clasei">
        <textarea name="description" id="description" placeholder="Descrierea clasei" rows="5"></textarea>
        <button type="submit">Creaza</button>
    </form>
</body>
</html>
