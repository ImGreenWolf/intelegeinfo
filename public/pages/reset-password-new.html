<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resetare parola</title>
    <link rel="stylesheet" href="/css/password-reset.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Playwrite+DK+Loopet:wght@100..400&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    
</head>
<body>
    
    <div class="pass-container">
        <h1>Reseteaza-ti parola</h1>
        <p>Introdu emailul cu care ti-ai creat contul, pe care vei primi un link ca sa-ti resetezi parola!</p>
        <form action="" method="post" id="form">
            <input type="email" name="email" id="email" value="#{email}" autocomplete="username" style="display: none;">
            <label for="password">Parola noua</label>
            <input type="password" name="password" id="password" autocomplete="new-password" required placeholder="Introdu parola..">
            <label for="confirm-password">Confirma parola</label>
            <input type="password" name="confirm-password" id="confirm-password"  autocomplete="new-password" required placeholder="Inca o data..">
            <button type="submit">Schimba Parola</button>
            <p id="message"></p>
        </form>
        <script>
            document.getElementById('form').onsubmit = (ev) => {
                const pass = document.getElementById('password')
                const conf = document.getElementById('confirm-password')
                if(pass.value !== conf.value)
                {
                    ev.preventDefault()
                    document.getElementById('message').innerText = 'Parolele trebuie sa fie identice!'
                    setTimeout(() => {
                        document.getElementById('message').innerText = ''
                    }, 2000);
                }
                    
            }
        </script>
    </div>
</body>
</html>
