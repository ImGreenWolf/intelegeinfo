<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify your account</title>
    <link rel="stylesheet" href="../css/codeVerification.css">
    <link rel="stylesheet" href="../css/main.css">
    <style>
        body
        {
            background-color: rgb(37, 37, 37);
        }

    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Playwrite+DK+Loopet:wght@100..400&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    
</head>
        <header>
            <div class="horizontal">
                    
                <h1><a href="/">ÎnțelegeInfo</a></h1>
                <div id="colab-container">

                </div>

            
            </div>

            <div class="vertical">
                
            </div>
        </header>
<body>
    <form id="codeForm" method="post">
        <div class="text-container">
            <h1>Verificare Email</h1>
            <p>Am trimis un cod de verificare la #{emailCensored}</p>
        </div>
        <div class="input-container">
            <input type="number" maxlength="6" name="code" id="code" autocomplete="one-time-code">
            <div class="display" id="display">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
        </div>
        <input type="text" value="#{code}"hidden id="hmac">
        <div class="button-container">
            <button  type="submit">Verifica</button>
            <a href="/">Retrimite linkul</a>
            <p id="status"></p>
        </div>
        
    </form>
</body>


<script src="../client/scripts/emailCodeVerificationClient.js">



</script>

<script>
     async function submit()
    {
        let code = codeInput.value;
        const id = new URLSearchParams(window.location.search).get('id')
        const hmac = document.getElementById('hmac').value
        codeInput.value = '';
        await fetch('', {
            method: 'post',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({code,id,hmac})
        }).then(response => {
            return response.json()
        }).then(res => {

            if(res.sucess)
                location.href = res.redirect;
        }).catch(err => {
            document.getElementById('status').innerText = err
        })
    }
    form.addEventListener('submit', async (ev) => {

        ev.preventDefault()
        submit()
    })
</script>
</html>
