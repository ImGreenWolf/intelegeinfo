<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify your account</title>
    <link rel="stylesheet" href="../css/codeVerification.css">
    <link rel="stylesheet" href="../css/main.css">
    <style>
        body
        {
            background-color: rgb(37, 37, 37);
        }

    </style>
</head>
        <header>
            <div class="horizontal">
                    
                <h1><a href="/">ÎnțelegeInfo</a></h1>
                <div id="colab-container">

                </div>

            
            </div>

            <div class="vertical">
                
            </div>
        </header>
<body>
    <form id="codeForm" method="post">
        <div class="text-container">
            <h1>Verificare Email</h1>
            <p>Am trimis un cod de verificare la #{emailCensored}</p>
        </div>
        <div class="input-container">
            <input type="number" maxlength="6" name="code" id="code" autocomplete="off">
            <div class="display" id="display">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
        </div>
        <input type="text" value="#{code}"hidden id="hmac">
        <div class="button-container">
            <button  type="submit">Verifica</button>
            <a href="/">Retrimite linkul</a>
        </div>
        
    </form>
</body>


<script>
    
    const form = document.getElementById('codeForm')
    const codeInput = document.getElementById('code')
    const display = document.getElementById('display')

    let lastIndex=0;

    codeInput.oninput = (ev) => {

        // if(index<=0)
        //     display.children[0].innerHTML = ''
        const code = ev.target.value;
        // ev.target.value='';
        const index = code.length-1 //ev.target.value.length-1;

        if(index>5)
            return;
        
        console.log(index)
        if(index>=lastIndex)
        {
            display.children[index].innerHTML = code[index]
            display.children[index].classList.add('filled')
        }
        else
            for(i=index+1;i<=lastIndex;i++)
            {
                display.children[i].innerHTML = ''
                display.children[i].classList.remove('filled')
            }
                


        lastIndex = index;
        // for(let i=0;i<6;i++)
        //     if(i<=index && index!=0)
        //     {
                
                   
        //         display.children[i].classList.add('filled')
                
        //     }
        //     else
        //     {
        //         display.children[i].classList.remove('filled')
        //         display.children[i].innerHTML = ''
        //     }
    }

    async function submit()
    {
        let code = codeInput.value;
        const id = new URLSearchParams(window.location.search).get('id')
        const hmac = document.getElementById('hmac').value
        codeInput.value = '';
        await fetch('', {
            method: 'post',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({code,id,hmac})
        }).then(response => {
            return response.json()
        }).then(res => {

            if(res.sucess)
                location.href = res.redirect;
        })
    }
    form.addEventListener('submit', async (ev) => {

        ev.preventDefault()
        submit()
    })


</script>
</html>
