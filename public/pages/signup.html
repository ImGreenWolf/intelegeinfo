<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="../css/login-signup.css">
  <link rel="stylesheet" href="../css/main.css">

  <title>Signup Page</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Playwrite+DK+Loopet:wght@100..400&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    
</head>
<body>
  <header>
    <div class="horizontal">
            
        <h1><a href="/">ÎnțelegeInfo</a></h1>
        <div id="colab-container">

        </div>
    
    </div>

    <div class="vertical">
        
    </div>
</header>

<div style="height: 100%;">
  <form id="loginForm">
    <h2>Signup</h2>

    <div class="input-container">
      <input type="text" name="username" required placeholder="username.." autocomplete="username">
      <div class="inline">
        <input type="text" name="firstName" required placeholder="first name.." autocomplete="given-name" autocapitalize="on">
        <input type="text" name="lastName"required  placeholder="last name.." autocomplete="family-name" autocapitalize="on">
      </div>
      <input type="email" name="email" required id="email" placeholder="email.." autocomplete="email" autocapitalize="on">
      <div class="inline">
        <input type="password" name="password" required id="password" placeholder="password.." autocomplete="new-password" minlength="4">
        <input type="password" required id="confirm-password" placeholder="confirm password.." autocomplete="new-password" minlength="4">
      </div>
      <input type="hidden" name='loginMethod' value="local">
    </div>

    <div class="button-container">

      <div>
        <button type="submit">Signup</button>
        <a href="./login">or log in an existing account instead</a>
      </div>
      <p id="message"></p>
      <div class="login-method-container">
        <button onclick="loginWithGoogle()" class="google login-method">Login with Google</button>
      </div>
    
    </div>
  </form>


  
</div>
  <script src="https://cdn.jsdelivr.net/npm/bcryptjs@v3.0.2/umd/index.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/forge/0.10.0/forge.min.js"></script>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const formData = new FormData(e.target);
      
      if(document.getElementById('password').innerText != document.getElementById('confirm-password').innerText)
      {
        document.getElementById('message').innerText = "Parolele nu sunt la fel"
        setTimeout(() => {
            document.getElementById('message').innerText = '';
        }, 5000);
        return;
      }
      const pubKeyPem = await fetch('/signup/public-key').then(res => res.text());
      const publicKey = forge.pki.publicKeyFromPem(pubKeyPem);

      
      const encrypted = publicKey.encrypt(formData.get('password'), 'RSA-OAEP');
      const encryptedBase64 = forge.util.encode64(encrypted);
      formData.set("password", encryptedBase64)

      const data = Object.fromEntries(formData.entries());


      const response = await fetch('/signup', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(data)
      });

        const result = await response.json();
        document.getElementById("message").textContent = result.message ? result.message : result.error;

        setTimeout(() => {
          window.location.href = result.redirect + `?id=${result.id}`
        }, 1000);
        
    });

    
  </script>
</body>
</html>
