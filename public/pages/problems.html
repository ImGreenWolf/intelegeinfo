<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directory Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: rgb(22,22,22);
            color: white
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            margin: 5px 0;
        }
        a {
            color: rgb(255, 255, 255);
        
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Probleme</h1>
    <div id="problem-list">

    </div>

    <script>
        async function fetchDirectory() {
            try {
                const response = await fetch('/editor/problem/page'); // Adjust the endpoint as needed
                if (!response.ok) {
                    throw new Error('Failed to fetch directory data');
                }
                const sessionId = new URLSearchParams(location.search).get('sessionId')
                const data = await response.json();
                const list = document.getElementById('problem-list');
                list.innerHTML = '';
                console.log(data)
                data.forEach(item => {
                    const listItem = document.createElement('li');
                    const link = document.createElement('a');
                    link.href = `../editor/problem/${sessionId}/details/${item.id}`;
                    link.textContent = item.name
                    listItem.appendChild(link);
                    list.appendChild(listItem);
                });
            } catch (error) {
                console.error('Error fetching directory:', error);
            }
        }

        fetchDirectory();

        // async function test(problemId)

        //     const res = await fetch(`../editor/problem/${sessionId}/test/${problemId}`)
        //     console.log(res.body)
        // }

        // test(1)
    </script>
</body>
</html>
