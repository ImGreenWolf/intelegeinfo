<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directory Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            margin: 5px 0;
        }
        a {
            text-decoration: none;
            color: blue;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Directory Viewer</h1>
    <ul id="directory-list"></ul>

    <script>
        async function fetchDirectory() {
            try {
                const response = await fetch('/editor/problem/page'); // Adjust the endpoint as needed
                if (!response.ok) {
                    throw new Error('Failed to fetch directory data');
                }
                const data = await response.json();
                const list = document.getElementById('directory-list');
                list.innerHTML = '';
                data.forEach(item => {
                    const listItem = document.createElement('li');
                    const link = document.createElement('a');
                    link.href = item.path;
                    link.textContent = JSON.parse(item.data).name || item.data.name || 'Unnamed Problem';
                    listItem.appendChild(link);
                    list.appendChild(listItem);
                });
            } catch (error) {
                console.error('Error fetching directory:', error);
            }
        }

        // fetchDirectory();

        async function test(problemId)
        {
            const sessionId = new URLSearchParams(location.search).get('sessionId')
            const res = await fetch(`../editor/problem/${sessionId}/test/${problemId}`)
            console.log(res.body)
        }

        test(1)
    </script>
</body>
</html>
