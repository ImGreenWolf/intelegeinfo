<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metrics</title>
    <style>
        .grid
        {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            width: 100%;

<body style="display: flex; flex-direction: column; height: 100vh; margin: 0;padding: 0;">

    <p id="output" style="overflow-y: scroll; height: 100%; white-space: pre; font-family: monospace;"></p>
    <script type="module" src="/client/scripts/metrics.js"></script>
</body>
</html>
