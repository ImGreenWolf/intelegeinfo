<div>
  <form id="loginForm">
    <h2>Login</h2>

    <div class="input-container">
      <input type="email" name="email" required id="email" placeholder="email.." autocomplete="email">
      <input type="password" name="password" required id="password" class="animhidden"  placeholder="password.." autocomplete="current-password">

  <script src="https://cdn.jsdelivr.net/npm/bcryptjs@v3.0.2/umd/index.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/forge/0.10.0/forge.min.js"></script>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      document.getElementById("message").textContent = '';
      const formData = new FormData(e.target);
      
      const salt = bcrypt.genSaltSync(4);



        const pubKeyPem = await fetch('/login/public-key').then(res => res.text());
        const publicKey = forge.pki.publicKeyFromPem(pubKeyPem);

        
        const encrypted = publicKey.encrypt(formData.get('password'), 'RSA-OAEP');
        const encryptedBase64 = forge.util.encode64(encrypted);

        formData.set("password", encryptedBase64)
        const data = Object.fromEntries(formData.entries());


      const response = await fetch('/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
      })
      .then(function (response) {
        if(response.ok || response.code === 200)
        window.location.href = '/profile';
          return response.json();
    }).then((result) => { 
        
        document.getElementById("message").textContent = result.message;
 
      })

      // const result = await response.json();
      
    });

    // document.getElementById("email").addEventListener("submit", async function (e) {

    function showPassField(focus)
    {
      
      passField.classList.add('active-field')
      if(focus)
        passField.focus()
    }

    function handleEnterKey(e) 
    {
      
        if ((!e.key || e.key === "Enter") && emailInput.checkValidity() ) {
          
          e.preventDefault();
          showPassField(true)
          emailInput.removeEventListener("keypress", handleEnterKey); // since we dont hide the password field, we can just delete this listener
        
        }      
    } 

    function handleInput(e) 
    {
      console.log(e.inputType)
      if (e.inputType = 'insertFromPaste'  && emailInput.checkValidity() ) {
          
          // e.preventDefault();
          
          showPassField(passField.value == '')
          emailInput.removeEventListener("input", handleInput); // since we dont hide the password field, we can just delete this listener
        
        }  
    }
    
    function handlePassInput(e)

  emailInput.addEventListener("keypress", handleEnterKey);
