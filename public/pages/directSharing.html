<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.5">
    <title>Direct Sharing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Playwrite+DK+Loopet:wght@100..400&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Teachers:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">

    <style>
        div.progress-bar {
            width: 100%;
            display: flex;
            /* border: 1px solid black; */
            box-shadow: 0 0 10px 0px rgba(0, 0, 0, 0.178);
            border-radius: 1em;
            min-height: 1em;
            overflow: hidden;
            div {
                background-color: rgb(14, 14, 14);
                transition-duration: 0.1s;
            }
            &:not(:has(.active)) {
                display: none;
            }
        }
        img, video {
            height: 600px;
        }
        html,body {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        body {
            width: 500px;
            margin: auto;
            display: grid;
            text-align: center;
            grid-template-columns: 1fr;
            font-family: Poppins;
            align-items: center;
            align-content: center;
            justify-items: center;
            justify-content: center;
            font-size: 1.5em;
            padding: 2em;
            box-sizing: border-box;
        }
        body > div {
            width: 100%;
            display: flex;
            margin: 0.5em;
            gap: 1em;
            min-height: 2em;
        }
        input {
            
            border-radius: 3em;
            padding: 0 2em;
            border: 0;
            box-shadow: 0 0 10px 0px rgba(0, 0, 0, 0.178);
            outline: none;
            font-family: inherit;
            font-weight: 500;
            flex-grow: 2;
        }
        button {
            font-family: inherit;
            padding: 0 2em;
            flex-grow: 1;
            border-radius: 2em;
            border: none;
            box-shadow: 0 0 10px 0px rgba(0, 0, 0, 0.438);
            font-weight: 700;
            background-color: rgb(43, 43, 43);
            color: whitesmoke;
            text-shadow: 2px 2px 2px rgba(0, 0, 0, 0.24);
            transition-duration: 0.2s;
        }
        button:disabled {
            opacity: 0.5;
        }
        button:not(:disabled):hover {
            opacity: 0.9;
            filter: blur(0.5px);
        }
        button:not(:disabled):active {
            opacity: 0.8;
            filter: blur(1px);
            transition-duration: 0.05s;
        }
        #selectFile {
            background-color: rgb(22, 84, 177);
        }
        
        a[download] {
            color: rgb(22, 84, 177);
        }
        .output-container {
            flex-direction: column;
            font-size: 1rem;
            pre {
                font-size: 0.75em;
                text-wrap: auto;
                min-height: 100px;
            }
            
        }

        .title-container {
            flex-direction: column;
            &>* {
                margin: 0;
            }
        }
        .status-info-container
        {
            display: flex;
            width: 20px;
            align-items: center;
        }
        #connected.active {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: green;
            margin: auto;
        }
        .action-container {
            display: flex;
            flex-direction: column;
            gap: 0.5em;
        }
    </style>
</head>
<body>
    <script type="module">
        import { copySendLink, copyRecieveLink } from "/client/scripts/sharing/directSharing.js";
        window.copySendLink = copySendLink;
        window.copyRecieveLink = copyRecieveLink;
    </script>

    <div class="title-container">
        <h3>Your code:</h3>
        <h1 id="ownCodeDisplay"></h1>
    </div>

    <div>
        <input type="text" id="code" placeholder="Enter target code...">
        <div class="status-info-container">
            <div id="connected"></div>
        </div>
        <button id="selectFile" disabled>Select file</button>
    </div>

    <div>
        <button onclick="window.copySendLink()">Copy Send link</button>
        <button onclick="window.copyRecieveLink()">Copy Receive link</button>
    </div>
        
    <div class="progress-bar">
        <div id="progressBar"></div>
    </div>
    <div class="output-container">
        <div id="action-container">

        </div>
        <pre id="output"></pre>
    </div>
    
    
    <script type="module" src="/client/scripts/sharing/directSharing.js"></script>
    
</body>
</html>
