<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meditatii</title>
      <link rel="stylesheet" href="../css/main.css">
       <link rel="stylesheet" href="../css/course.css">
</head>

<body>

    ^{&file:_header.html}


    <form action="" method="post">
        <label for="experience">Experienta</label>
        <input type="text" name="experience" id="experience">
        <label for="description">Descriere</label>
        <textarea name="description" id="description"></textarea>
        <label for="courseLength">Durata cursului minute</label>
        <input type="number" name="courseLength" id="courseLength">
        <label for="price">Pretul cursului</label>
        <input type="number" name="price" id="price">
        <h2>Date de contact</h2>
        <label for="phone">Telefon</label>
        <input type="tel" name="phone" id="phone">
        <label for="instagram">Social media</label>
        <input type="url" name="instagram" id="instagram">
        <label for="email">Email</label>
        <input type="email" name="email" id="email" value="^{*user.email}">
        <button type="submit">Creaza</button>
    </form>

</body>
</html>
