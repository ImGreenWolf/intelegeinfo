<link rel="stylesheet" href="/css/main.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Playwrite+DK+Loopet:wght@100..400&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Teachers:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
   
<link rel="stylesheet" href="/css/problem.css">

<body>
  <a href="/pages/problems.html" style="color: rgba(255, 255, 255, 0.445); text-decoration: none;">&leftarrow;</a>
  <div>
    ${html.solvesUI}
  </div>
  <h1>${json.name}</h1>
  <h3>Dificultate ${json.difficulty}</h3>
  <p>${json.description}</p>
  <h2>Exemplu</h2>
  <div class="sample-container">
    <div>
      <p>date de intrare</p>
      <samp>${json.tests[0].dataIn}</samp>
    </div>
    
    <div>
      <p>date de iesire</p>
      <samp>${json.tests[0].dataOut}</samp>
    </div>
  </div>

  <div class="controls-wrapper">
      <nav><button onclick="this.parentElement.parentElement.classList.remove('switch')">Testeaza Cod</button>
        <button onclick="this.parentElement.parentElement.classList.add('switch')">Explica</button></nav>

    <div>
      <div class="button-container">
        <button class="openProblem" onclick="window.problem.test(`${sessionId}`, `${json.id}`)">Testeaza</button>
        <div class="ai-button-wrapper">
          <button class="openProblem ai-button" onclick="window.problem.evaluate(`${sessionId}`, `${json.id}`)" 
          title="Primeste feedback despre solutia ta atunci cand resolvi problema 100%.">AI Feedback</button>

          <svg class="highlight-svg" viewBox="0 0 220 56" preserveAspectRatio="none" aria-hidden="true">
            <!-- background static outline -->
            <rect class="static-outline" x="1.5" y="1.5" width="217" height="53" rx="12" ry="12"></rect>

            <!-- moving dash. The rect dimensions match the static outline. Perimeter used in CSS animation is ~500 (2*(217+53) =~ 540 but small differences are OK) -->
            <rect class="moving" x="1.5" y="1.5" width="217" height="53" rx="12" ry="12"></rect>
          </svg>
        </div>
      </div>

      <div class="explain-container">
        <h2>Explica solutia in limbaj natural</h2>
        <textarea name="explain" id="explain" rows="3"></textarea>
        <button id="evaluate-explenation">Evalueaza</button>
      </div>

    </div>
  </div>
  <div id="output">

  </div>
  <div>
    <span id="final-score"></span>
  </div>
  




<!-- <script type="module" src="/client/scripts/problemTemplate.js"></script>    -->
<script type="module">
  import * as problem from '/client/scripts/problems/problemTemplate.js'
  window.problem = problem
  problem.init(`${json.id}`)
  </script>
</body>
</html>
