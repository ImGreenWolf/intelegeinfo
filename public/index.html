<body>
    

    <div class="container">
        <header>
            <div class="horizontal">
                
            <h1>C++ Online Debugger</h1>
            <nav>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
            
            </div>

            <div class="vertical">
                
            </div>
        </header>

            <div id="editor-container">
                <div id="editor-tabs">
                    <span>main.cpp</span>
                </div>
                <div id="editor">   
                    #include 
                    int main() {
                        int x = 5;
                        std::cout << "Hello, Debugger!";
                        return 0;
                    }
                </div>
            </div>
           
                <div class="buttons">
                    <button onclick="compileCode()">Compile</button>
                    <button onclick="sendDebugCommand('break main')">Set Breakpoint at main()</button>
                    <button onclick="playback()">Playback</button>
                    <button onclick="sendDebugCommand('run')">Run in Debugger</button>
                    <button onclick="sendDebugCommand('next')">Step Over</button>
                    <button onclick="sendDebugCommand('execute')">Execute Code</button>
                    <button onclick="sendDebugCommand('continue')">Continue Execution</button>
                    <button onclick="sendDebugCommand('quit')">Stop Debugging</button>
                </div>

            
            

             
        <div id="vector-container"></div>
        <div id="output-container">
            <div> <h2>Output</h2>
                <button onclick="this.parentElement.parentElement.style.display = 'None'">x</button>
            </div>
           
            <pre id="output" style="line-height: px;"></pre>
            <div id="console-container">
            
                <textarea id="console" oninput="//submitConsole(this);"></textarea>
            <button onclick="submitConsole(document.getElementById('console'))">Send</button>
            </div>
        </div>
       
        
        
       
    </div>

    <script>var exports = {};</script>
    <script src="/ace-builds-master/src-noconflict/ace.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/varMarkers.js" type="text/javascript" charset="utf-8"></script>
    <script src="https://www.unpkg.com/ace-builds@latest/src-noconflict/ext-language_tools.js" crossorigin="anonymous"></script>

    <script src="js/codeEditor.js" type="text/javascript" charset="utf-8"></script>

    <script>

        writeOutput(window.innerWidth)
    </script>
</body>
</html>
