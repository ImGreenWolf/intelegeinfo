<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <filter id="noiseFilter">
    <feTurbulence
      type="turbulance"
      baseFrequency="0.08"
      numOctaves="3"
      seed="2"
      stitchTiles="stitch">
      <animate
        attributeName="seed"
        from="0"
        to="5"
        dur="1"
        repeatCount="indefinite"/>
    </feTurbulence>
  </filter>
  <rect width="100%" height="100%" filter="url(#noiseFilter)"/>
</svg>
