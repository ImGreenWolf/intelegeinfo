<script type="module">
        
        import * as editor from '/editor/codeEditor.js'
        window.editor = editor;
        // if (e.key === "Enter" && !e.shiftKey) {
        //         e.preventDefault();

        //         e.currentTarget.closest("form").submit();

    </script>
<body>
        
   
    <div class="container">
        
            <!-- <div id="name-prompt">
                <textarea id="name-prompt-text"></textarea>
                <button onclick="createFile(document.getElementById('name-prompt-text').value)">Create</button>
            </div> -->

        <div id="editor-container">
            <div id="editor-tabs">
                <div  class="editor-tabs-container">  
                    <div  id="editor-tabs-container" class="file-scroller" style="width: auto;">     

                    </div>              
                    <span id="name-prompt"  contenteditable="plaintext-only" style="display: none;"></span>
                    <div class="ridge-gradient inset-button black circle">
                        <button class="create-file" id="createFile" onclick="window.editor.createFileNamePrompt()"></button>
                    </div>
                </div>

            </div>
                <div id="code-window-container">
                    <!-- <div id="editor" translate="no"></div>   -->
                </div>
            </div>
            
        <div class="buttons" id="buttons">
            <p id="compile-status"></p>
            <button onclick="window.editor.sendDebugCommand('execute')" class="execute-control" id="execute-control">Executa Programul</button>
            <button onclick="window.editor.sendDebugCommand('-exec-run')" id="run">Run in Debugger</button> 
            <!-- <button onclick="window.editor.compileCode()" class="compile" id="compile">Compile</button> -->
            <!-- <button onclick="sendDebugCommand('break main')">Set Breakpoint at main()</button> -->
            <button onclick="window.editor.playback()" class="debug-control" id="playback">Playback</button>
            <div class="speed-control debug-control" id="speed-control"> 
                <button onclick="window.editor.restartPlayback()">r</button>
                <button onclick="window.editor.setPlaybackSpeed(1)">></button>
                <button onclick="window.editor.setPlaybackSpeed(2)">>></button>
                <button onclick="window.editor.setPlaybackSpeed(3)">>>></button>
            </div>
            <button onclick="window.editor.sendDebugCommand('-exec-next')" class="debug-control" id="next">Step Over</button>

            <!-- <button onclick="sendDebugCommand('continue')">Continue Execution</button> -->
            <button onclick="window.editor.sendDebugCommand('-exec-quit')" class="debug-control" id="quit">Stop Debugging</button>
        </div>

            
            

             
        <div id="output-container">
            
            <div id="client-area-body">
                <samp id="output"  translate="no">
            </div>
                
            </samp>
            <div id="typingIndicatorContainer"></div>

            <div id="console-container">
            
                <textarea id="console" oninput="window.editor.onConsoleInput(this)" placeholder="scrie..." translate="no"></textarea>
            <button onclick="window.editor.submitConsole(document.getElementById('console'))"></button>
            </div>
    </div>
       
        
        
       
    </div>
