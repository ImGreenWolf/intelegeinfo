<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guide Creator</title>
    <link rel="stylesheet" href="/css/guides.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Playwrite+DK+Loopet:wght@100..400&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<style>
        body {
            display: flex;
            justify-content: space-around;
            min-height: 100vh;
             margin-top: 100px;
        }
        #preview {
            /* border: 1px solid gray; */
            max-width: 100%;
            padding: 20px;
            margin-top: 0;
        }
        form {
            display: flex;
            flex-direction: column;
            width: 30%;
        }
        form input[type="text"]
        {
            height: 2lh;
        }
        form textarea {
            width: 100%;
            min-height: 700px;
        }
        form button[type="submit"] {
            height: 2lh;
        }
        content::after
        {
            content: none;
        }
    </style>

</head>
<body>
    
    <form action="./submit" method="post">
        <input type="text" name="gname" id="gname" placeholder="nume">
        <input type="text" name="description" id="description" value="" placeholder="descriere">
        <input type="text" name="category" id="category" value="" placeholder="categorie">
        <textarea type="text"  name="content" id="content" placeholder="continut"></textarea>
        <button type="submit">Submit</button>
    </form>

    <article style="margin: 0;">
        <content id="preview">
        
        </content>
    </article>

    <script>
        const preview = document.getElementById('preview')
        const content = document.getElementById('content');
        preview.innerHTML = content.value;
        content.oninput = (ev) => {
            preview.innerHTML = ev.target.value;
        }
    </script>
</body>
</html>
