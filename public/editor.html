<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Compilator si Debugger C++; Intelege informatica mai usor folosing acest compilator! Vizualizeaza variabilele, vectorii si matricele in timp ce codul tau se excuta si altele!">
    <meta name="keywords" content="C++, info, cpp, clasa a 9 a, clasa a 9-a, scoala, edu, educatie,intelege info, understand programing, programare, prog, vizualizare">
    <meta name="author" content="Radu Bitere">
    <meta name="viewport" content="width=device-width, initial-scale=0.5">
    <title>Intelege Info</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/codeEditor.css">
      <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Playwrite+DK+Loopet:wght@100..400&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
   
    <script src="/ace-builds-master/src-noconflict/ace.js" type="text/javascript" charset="utf-8"></script>

    <script src="/ace-builds-master/src-noconflict/mode-c_cpp.js"></script>
    <script  type="module" src="/editor/codeEditor.js" type="text/javascript" charset="utf-8"></script>
    <!-- lazy loading -->
    <link rel="stylesheet" href="../css/codeVerification.css">
</head>

<script type="module">
        
        import * as editor from '/editor/codeEditor.js'
        window.editor = editor;
        // if (e.key === "Enter" && !e.shiftKey) {
        //         e.preventDefault();

        //         e.currentTarget.closest("form").submit();
        //     }
    </script>
<body>
        

    <div class="container">
        <header>
            <div class="horizontal">
                    
                <h1><a href="/">ÎnțelegeInfo</a></h1>
                <div id="colab-container">

                </div>
                <nav>
                    
                    <ul id="header-buttons">
                        <button id="join-session">Join Session</button>
                        #{login}
                        <div class="dropdown-container">
                            <input type="checkbox" id="mobile-dropdown">
                            <div class="dropdown">

                                <button id="join-session" class="tight-screen" onclick="window.editor.joinsession()">Join Session</button>
                            </div>
                        
                        </div>
                        
                    </ul>
                </nav>
            
            </div>

            <div class="vertical">
                
            </div>
        </header>

            <!-- <div id="name-prompt">
                <textarea id="name-prompt-text"></textarea>
                <button onclick="createFile(document.getElementById('name-prompt-text').value)">Create</button>
            </div> -->

            <div id="editor-container">
                <div class="shadow inset"></div>
                <div id="editor-tabs">
                    <div  class="editor-tabs-container">  
                        <div  id="editor-tabs-container" class="editor-tabs-container" style="width: auto;">     

                        </div>              
                        <span id="name-prompt"  contenteditable="plaintext-only" style="display: none;"></span>
                    </div>
                    <div id="session-controls">
                        <div class="ridge-gradient inset-button black">
                            <button class="share-session" id="share" onclick="window.editor.copySessionLink()">share</button>
                        </div>
                        <div class="ridge-gradient inset-button black">
                            <button class="share-session" id="saveProject" onclick="window.editor.saveProject()">save</button>
                        </div>
                        <div class="ridge-gradient inset-button black circle">
                            <button class="create-file" id="createFile" onclick="window.editor.createFileNamePrompt()"></button>
                        </div>
                    </div>
                </div>
                <div id="editor" translate="no">   
                </div>
            </div>
            
                <div class="buttons" id="buttons">
                    <p id="compile-status"></p>
                    <button onclick="window.editor.sendDebugCommand('execute')" class="execute-control" id="execute-control">Execute Code</button>
                    <button onclick="window.editor.sendDebugCommand('run')" id="run">Run in Debugger</button> 
                    <button onclick="window.editor.compileCode()" class="compile" id="compile">Compile</button>
                    <!-- <button onclick="sendDebugCommand('break main')">Set Breakpoint at main()</button> -->
                    <button onclick="window.editor.playback()" class="debug-control" id="playback">Playback</button>
                    <div class="speed-control debug-control" id="speed-control"> 
                        <button onclick="window.editor.restartPlayback()">r</button>
                        <button onclick="window.editor.setPlaybackSpeed(1)">></button>
                        <button onclick="window.editor.setPlaybackSpeed(2)">>></button>
                        <button onclick="window.editor.setPlaybackSpeed(3)">>>></button>
                    </div>
                    <button onclick="window.editor.sendDebugCommand('next')" class="debug-control" id="next">Step Over</button>

                    <!-- <button onclick="sendDebugCommand('continue')">Continue Execution</button> -->
                    <button onclick="window.editor.sendDebugCommand('quit')" class="debug-control" id="quit">Stop Debugging</button>
                </div>

            
            

             
        <div id="vector-container"></div>
        <div id="output-container">
            <div class="tabs-container"> 
                <!-- <h2>Output</h2> -->
                <!-- <button onclick="this.parentElement.parentElement.style.display = 'None'">x</button> -->
                 <span class="file-tab">Chat</span>
            </div>

            <samp id="output"  translate="no">

                
            </samp>
            <div id="typingIndicatorContainer"></div>

            <div id="console-container">
            
                <textarea id="console" oninput="window.editor.onConsoleInput(this)" placeholder="scrie..." translate="no"></textarea>
            <button onclick="window.editor.submitConsole(document.getElementById('console'))"></button>
            </div>
        </div>
       
        
        
       
    </div>


    <script>var exports = {};</script>

    <script src="/ace-builds-master/src-noconflict/ext-modelist.js"></script>
   
    
</body>
</html>
