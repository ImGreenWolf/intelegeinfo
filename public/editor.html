<body>
        
   
    <div class="container" id="editor-grid-container"> 
        
        <mini-dock>
            <a href="/" id="home">&leftarrow;</a>
            <a href="./editor" id="new">&plus;</a>

            <div class="session-container">

                <div id="sessionInfo-container">
                    
                </div>
            </div>
            <div id="editor-container">
                <div id="editor-tabs">
                    <div  class="editor-tabs-container">  
                        <div  id="editor-tabs-container" class="file-scroller">     

                        </div>              
                        <span id="name-prompt" class="file-tab" contenteditable="plaintext-only" style="display: none;"></span>
                        <div class="ridge-gradient inset-button black circle">
                            <button class="create-file" id="createFile" onclick="window.editor.createFileNamePrompt()"></button>
                        </div>
                    </div>
                    <div id="session-controls" class="controls">                   
                        <div class="slide-out-display">
                            <div class="ridge-gradient inset-button black circle">
                                <button onclick="document.getElementById('slide-out').classList.toggle('enabled')" id="slide-out-button">&ltri;</button>
                            </div>
                            <div class="slide-out-container" id="slide-out">
                                <button onclick="window.editor.toggleCamera()" id="toggle-camera">📷</button>
                                <button onclick="window.editor.beautifyEditor()">Beautify</button>
                                <button onclick="window.editor.redo()" id="editor-undo">&circlearrowright;</button>
                                <button onclick="window.editor.undo()" id="editor-redo">&circlearrowleft;</button>
                                <button onclick="window.editor.downloadEditorFiles()" id="editor-download">&DownArrowBar;</button> 
                            </div>
                            <vl></vl>
                        </div>
                        <div class="ridge-gradient inset-button black">
                            <button class="share-session" id="share" onclick="window.editor.copySessionLink()">share</button>
                        </div>
                        <div class="ridge-gradient inset-button black">
                            <button class="share-session" id="saveProject" onclick="window.editor.saveProject()">save</button>
                        </div>
                        
                    </div>
                </div>
                    <div id="code-window-container">
                        <!-- <div id="editor" translate="no"></div>   -->
                         <!-- TODO load using js -->
                         <div  class="loading-logo">
                            <object type="image/svg+xml"  data="/media/logoText.svg" alt="Intelegeinfo"></object>
                            <p>Pagina se incarca, va rog asteptati...</p>
                         </div>
                    </div>
                </div>
            
                <div class="buttons" id="buttons">
                    <p id="compile-status"></p>
                    <button onclick="window.editor.sendDebugCommand('execute')" class="execute-control" id="execute-control">
                        <span style="background-image: url(../media/icons/play_arrow.svg);" class="button-icon"></span>
                        <span></span>Executa Programul
                    </button>
                    <button onclick="window.editor.sendDebugCommand('-exec-run')" id="run">
                        <span style="background-image: url(../media/icons/troubleshoot.svg);" class="button-icon"></span>
                        Run in Debugger
                    </button> 
                
                    <button onclick="window.editor.playback()" class="debug-control" id="playback">Playback</button>
                    <div class="speed-control debug-control" id="speed-control"> 
                        <button onclick="window.editor.restartPlayback()">r</button>
                        <button onclick="window.editor.setPlaybackSpeed(1)">></button>
                        <button onclick="window.editor.setPlaybackSpeed(2)">>></button>
                        <button onclick="window.editor.setPlaybackSpeed(3)">>>></button>
                    </div>
                    <button onclick="window.editor.sendDebugCommand('-exec-next')" class="debug-control" id="next">Step Over</button>

        
                    <button onclick="window.editor.sendDebugCommand('-exec-quit')" class="debug-control" id="quit">Stop Debugging</button>
                </div>

            
            

             
        <div id="vector-container"></div>
        <div id="output-container">
            <div class="tabs-container"> 
                <div class="editor-tabs-container"> 
                    <div class="file-scroller"> 
                    </div>
                <!-- <h2>Output</h2> -->

            </div>

            <div id="typingIndicatorContainer"></div>

            <div id="console-container">
            
            <textarea id="console" oninput="window.editor.onConsoleInput(this)" placeholder="scrie un mesaj..." translate="no"></textarea>
            <button onclick="window.editor.submitConsole(document.getElementById('console'))"></button>
            </div>
